name: SOFIX Android APK (public beta)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 37 and NDK 30
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Checkout pinned open-source VPN core
        run: |
          git clone --filter=blob:none https://github.com/2dust/v2rayNG.git upstream
          cd upstream
          git checkout 118cf5bc7d0b290947b0827f5ad03e73018d8e5d
          git submodule update --init --recursive AndroidLibXrayLite hev-socks5-tunnel
      - name: Apply SOFIX pairing and branding
        run: python3 android/apply_overlay.py upstream
      - name: Build native Xray tunnel library
        run: |
          cd upstream
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/
      - name: Download pinned Android Xray AAR
        run: |
          cd upstream
          TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          mkdir -p V2rayNG/app/libs
          curl -fLSs --retry 3 "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar" -o V2rayNG/app/libs/libv2ray.aar
          test "$(stat -c%s V2rayNG/app/libs/libv2ray.aar)" -gt 100000
      - name: Build SOFIX VPN APK
        run: |
          cd upstream/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleFdroidDebug --no-daemon --stacktrace -PABI_FILTERS=arm64-v8a
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'
      - name: Collect APK + checksums + GPL sources
        run: |
          mkdir -p dist
          find upstream/V2rayNG/app/build/outputs/apk -name '*arm64-v8a*.apk' -type f -print -exec cp '{}' dist/SOFIX-VPN-Android-arm64-beta.apk ';'
          test -s dist/SOFIX-VPN-Android-arm64-beta.apk
          (cd dist && sha256sum SOFIX-VPN-Android-arm64-beta.apk > SHA256SUMS)
          cp README.md dist/SOURCE.txt
          zip -q -r dist/SOFIX-VPN-source.zip upstream android -x 'upstream/**/.git/**' 'upstream/**/build/**' 'upstream/**/.gradle/**' 'upstream/V2rayNG/app/libs/*.aar' 'upstream/libs/**'
      - name: Upload APK and GPL sources
        uses: actions/upload-artifact@v4
        with:
          name: sofix-vpn-android-beta
          path: dist/
          retention-days: 30
